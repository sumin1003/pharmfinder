services:
  # ── 백엔드: Node.js Web Service ──────────────────────────────────────────
  - type: web
    name: pharmfinder-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # 아래 항목은 Render 대시보드 > Environment에서 직접 입력하세요
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MFDS_API_KEY
        sync: false
      - key: MFDS_API_URL
        value: https://apis.data.go.kr/1471000/DrbEasyDrugInfoService/getDrbEasyDrugList
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: HIRA_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: BACKEND_URL
        value: https://pharmfinder.onrender.com
      # 프론트엔드는 Vercel 배포 — CORS 허용 오리진
      - key: FRONTEND_URL
        value: https://pharmfinder.vercel.app
